[project]
name = "pythonlings"
version = "0.1.0"
description = "Learn Python by fixing small, broken programs. Built for beginners."
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "watchfiles>=1.0",
    "rich>=13.0",
]

[project.scripts]
pythonlings = "pythonlings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
